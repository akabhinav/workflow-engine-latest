id: event_rollup
namespace: analytics
description: Aggregate raw events into hourly buckets. Self-verifying.
inputs:
  - id: dbUrl
    type: STRING
    defaults: "jdbc:h2:mem:rollup_demo;DB_CLOSE_DELAY=-1"
tasks:
  - id: setup
    type: io.tranto.plugin.core.jdbc.Execute
    url: "{{ inputs.dbUrl }}"
    sql: |
      CREATE TABLE events(user_id INT, hr INT);
      CREATE TABLE hourly(hr INT, cnt INT);
      INSERT INTO events VALUES (1,9),(1,9),(1,10),(2,9)
  - id: rollup
    type: io.tranto.plugin.core.jdbc.Execute
    url: "{{ inputs.dbUrl }}"
    sql: "INSERT INTO hourly SELECT hr, COUNT(*) FROM events GROUP BY hr"
  - id: buckets
    type: io.tranto.plugin.core.jdbc.Query
    url: "{{ inputs.dbUrl }}"
    sql: "SELECT COUNT(*) FROM hourly"
  - id: verify
    type: io.tranto.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.buckets.firstValue == 2 }}"
